# SQLite 本地文件库。WAL + busy_timeout：并发写串行化重试，第二个写者拿到唯一约束冲突而不是 BUSY
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:${user.dir}/data/bus.db?journal_mode=WAL&busy_timeout=10000
quarkus.datasource.jdbc.max-size=4
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/

# 测试用独立库文件
%test.quarkus.datasource.jdbc.url=jdbc:sqlite:${user.dir}/target/test-bus.db?journal_mode=WAL&busy_timeout=10000
%test.quarkus.hibernate-orm.database.generation=drop-and-create
